<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
</head>
<body>
    <header>
        <h1>Smart Control</h1>
    </header>
    <main>
        <form action="codigo.html" method="get">
            <h2>Recuperar senha</h2>

            <label for="email_recuperar">Insira seu email</label>
            <input type="email" name="email_recuperar" id="email_recuperar" placeholder="Digite seu email de recuperação" required>
            <button type="submit">Confirmar</button>

        </form>
    </main>
</body>
</html>
