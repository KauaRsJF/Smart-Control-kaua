<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Smart Control</h1>
    </header>

    <main>
        <form action="redefinir.html" method="get">
        <h2>Redefinir senha</h2>
        <p>Enviaremos um códgio de 6 digitos para seu email</p>

        <label for="codigo">Insira seu código</label>
        <input type="text" name="codigo" id="codigo" minlength="6" maxlength="6" placeholder="Digite seu codigo" required>
        <button type="submit">Confirmar</button>
        </form>
    </main>
</body>
</html>
