<!DOCTYPE html>
<html lang ="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <title>Smart control></title>
    <link rel="stylesheet" href="asssets/css/index.css">
</head>
<body>
    <header>
        <h1>Smart Control</h1>
    </header>

    <main>
        <form action = "dashboard.html" method="get">
            <h2>Registrar-se</h2>
            <label for="usuario">Insira seu nome de usuário</label>
            <input type="text" name="usuario" id="usuario" placeholder="Digite seu nome de usuário" required>

            <label for="nome">Insira seu nome </label>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome" required>

            <label for="email">Insira seu email</label>
            <input type="email" name="email" id="email" placeholder="Digite seu email" required>

            <label for="senha">Insira sua senha</label>
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>

            
            <label for="repetir_senha">Repita sua senha</label>
            <input type="password" name="repetir_senha" id="repetir_senha" placeholder="Digite sua senha novamente" required>

            <label for="termos"><u>Termos de uso</u></label>
            <input type="checkbox" name="termos" required>

            <button type="submit">Registrar</button>
        </form>

    </main>
</body>
</html>
