<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
</head>
<body>
    <header>
        <h1>Smart Control</h1>
    </header>
    <main>
        <form action="index.html" method="get">
            <h2>Redefinir senha</h2>

            <label for="nova_senha">Insira sua senha</label>
            <input type="password" name="N-senha" id="N-senha" placeholder="Digite sua nova senha" required>

            
            <label for="repetir_senha">Repita sua senha</label>
            <input type="password" name="repetir_senha" id="repetir_senha" placeholder="Digite sua senha novamente" required>

            <button type="submit">Confirmar</button>

        </form>
    </main>
</body>
</html>
